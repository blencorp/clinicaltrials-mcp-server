name: schema-drift

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Verify the pinned schema, the SDK corpus and the curated fields against the live API
        id: verify
        run: pnpm verify:schema
        continue-on-error: true

      - name: Open issue on drift
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Pinned ClinicalTrials.gov schema has drifted from upstream
        run: |
          body="The weekly schema-drift job found that \`schema/openapi.pinned.json\`, \`schema/ctgov.json\` (the SDK corpus) or the curated study fields no longer match the live API (\`https://clinicaltrials.gov/api/oas/v2\`, \`/studies/metadata\`).

          To fix locally: \`pnpm verify:schema\` names each difference. Edit \`schema/openapi.pinned.json\` and \`schema/ctgov.json\` (and register a method for a new endpoint), then \`pnpm regen:sdk && node scripts/gen-sdk-reference.mjs && pnpm test\`.

          Run: $RUN_URL"
          existing=$(gh issue list --state open --label schema-drift --limit 100 --json title \
            --jq "map(select(.title == env.TITLE)) | length")
          if [ "$existing" = "0" ]; then
            gh issue create --title "$TITLE" --label schema-drift --body "$body"
          fi
