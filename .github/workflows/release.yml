name: release

# Placeholder until the release workflow lands (npm trusted publishing needs owner setup first).
# It builds the Claude Desktop bundle, clinicaltrials-mcp-server.mcpb: the name the documentation
# site's "Claude Desktop" button downloads from the latest GitHub Release
# (site/src/lib/install.ts, checked by site/scripts/check-links.mjs). It publishes nothing and
# runs only when started by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm mcpb:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clinicaltrials-mcp-server.mcpb
          path: clinicaltrials-mcp-server.mcpb
          if-no-files-found: error
